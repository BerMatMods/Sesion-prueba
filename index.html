<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AnthZz Berrocal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            color: #333;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .divider {
            margin: 25px 0;
            position: relative;
            text-align: center;
        }
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e5eb;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            color: #888;
            font-size: 13px;
            position: relative;
            z-index: 2;
        }
        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            color: #333;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .btn-google:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .google-icon {
            width: 22px;
            height: 22px;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }
        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        #statusMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            text-align: left;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        #userSection {
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #userSection img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 4px solid #667eea;
            object-fit: cover;
        }
        #userSection h3 {
            margin: 10px 0 5px;
            color: #333;
            font-size: 20px;
        }
        #userSection p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }
        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .btn-logout:hover {
            background: #c82333;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Sección de Login -->
        <div id="loginSection">
            <h2>🔐 Iniciar Sesión</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">📧 Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required autocomplete="email">
                </div>
                
                <div class="input-group">
                    <label for="password">🔑 Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </form>

            <div class="divider">
                <span>o continúa con</span>
            </div>

            <button class="btn-google" id="googleBtn">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Iniciar con Google
            </button>

            <p class="footer-text">
                ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
            </p>
        </div>

        <!-- Sección de Usuario Logueado -->
        <div id="userSection">
            <img id="userPhoto" src="" alt="Foto de perfil">
            <h3 id="userName">Nombre del Usuario</h3>
            <p id="userEmail">correo@ejemplo.com</p>
            <p style="font-size:12px; color:#888; margin-top:8px;">✅ Sesión activa con Google</p>
            <button class="btn-logout" id="logoutBtn">🚪 Cerrar Sesión</button>
        </div>

        <div id="statusMessage"></div>
    </div>

    <!-- Firebase SDK con TU configuración -->
    <script type="module">
        // ✅ Importar funciones necesarias de Firebase (URLs corregidas)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            createUserWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        // 🔥 TU CONFIGURACIÓN DE FIREBASE (PROPORCIONADA POR TI)
        const firebaseConfig = {
            apiKey: "AIzaSyBMeWl3gz-iALWcMPwHW6TMgEEIUSYKBTw",
            authDomain: "personalizacion-38cb1.firebaseapp.com",
            projectId: "personalizacion-38cb1",
            storageBucket: "personalizacion-38cb1.firebasestorage.app",
            messagingSenderId: "434378253117",
            appId: "1:434378253117:web:2c7a01062787756201db54",
            measurementId: "G-HTVYPVSG4X"
        };

        // ✅ Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 🎯 Configurar proveedor de Google (opcional pero recomendado)
        provider.setCustomParameters({
            prompt: 'select_account' // Permite elegir cuenta en móvil
        });

        // Referencias al DOM
        const loginSection = document.getElementById('loginSection');
        const userSection = document.getElementById('userSection');
        const statusMessage = document.getElementById('statusMessage');
        const googleBtn = document.getElementById('googleBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginForm = document.getElementById('loginForm');

        // 📢 Función para mostrar mensajes
        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = type;
            statusMessage.style.display = 'block';
            // Ocultar después de 5 segundos
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        // 🔵 INICIAR CON GOOGLE
        googleBtn.addEventListener('click', async () => {
            try {
                showMessage('🔄 Conectando con Google...', 'loading');
                googleBtn.disabled = true;

                // ✅ Abre popup de Google: usa la cuenta del teléfono/navegador
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                console.log('✅ Usuario Google logueado:', user.email);
                showMessage(`🎉 ¡Bienvenido, ${user.displayName || 'Usuario'}!`, 'success');
                
                // onAuthStateChanged se encargará de mostrar la UI
            } catch (error) {
                console.error('❌ Error Google:', error);
                
                if (error.code === 'auth/popup-closed-by-user') {
                    showMessage('⚠️ Cancelaste el inicio de sesión', 'error');
                } else if (error.code === 'auth/unauthorized-domain') {
                    showMessage('❌ Dominio no autorizado. Revisa Firebase Console > Authentication > Settings', 'error');
                } else if (error.code === 'auth/popup-blocked') {
                    showMessage('❌ Popup bloqueado. Permite ventanas emergentes para este sitio', 'error');
                } else {
                    showMessage(`❌ Error: ${error.message}`, 'error');
                }
            } finally {
                googleBtn.disabled = false;
            }
        });

        // ✉️ INICIAR CON EMAIL Y CONTRASEÑA
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                showMessage('🔄 Verificando credenciales...', 'loading');
                
                await signInWithEmailAndPassword(auth, email, password);
                showMessage('✅ ¡Sesión iniciada correctamente!', 'success');
                
            } catch (error) {
                console.error('❌ Error Email:', error);
                
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showMessage('❌ Correo o contraseña incorrectos', 'error');
                } else if (error.code === 'auth/invalid-email') {
                    showMessage('❌ Formato de correo inválido', 'error');
                } else {
                    showMessage(`❌ Error: ${error.message}`, 'error');
                }
            }
        });

        // 🚪 CERRAR SESIÓN
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                showMessage('👋 Sesión cerrada correctamente', 'success');
            } catch (error) {
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        });

        // 👁️ ESCUCHAR CAMBIOS DE AUTENTICACIÓN (EL CORAZÓN DEL SISTEMA)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ✅ Usuario autenticado
                console.log('🔐 Estado: Usuario logueado -', user.email);
                
                loginSection.classList.add('hidden');
                userSection.style.display = 'block';
                
                // Actualizar datos del usuario en la UI
                document.getElementById('userName').textContent = user.displayName || 'Usuario';
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userPhoto').src = user.photoURL || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.displayName || 'U') + '&background=667eea&color=fff&size=128';
                
            } else {
                // ❌ Usuario no autenticado
                console.log('🔓 Estado: Usuario no logueado');
                
                loginSection.classList.remove('hidden');
                userSection.style.display = 'none';
                statusMessage.style.display = 'none';
            }
        });

        // 🎁 Bonus: Registrar usuario nuevo (descomenta si necesitas registro)
        /*
        async function registerUser(email, password, displayName) {
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await userCredential.user.updateProfile({ displayName });
                return userCredential.user;
            } catch (error) {
                console.error('Error registro:', error);
                throw error;
            }
        }
        */
    </script>
</body>
</html>
