<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 Carta Especial de Amor</title>
    
    <!-- Google Fonts Románticas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Pacifico&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo animado con corazones flotantes */
        .hearts-container {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: float-up 10s linear infinite;
            opacity: 0.6;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Pétalos cayendo */
        .petal {
            position: absolute;
            font-size: 25px;
            animation: fall 15s linear infinite;
            opacity: 0.4;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Carta estilo sobre */
        .carta {
            background: linear-gradient(to bottom, #fff9fb 0%, #fff 100%);
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 80px rgba(255, 105, 180, 0.3);
            max-width: 600px;
            width: 100%;
            position: relative;
            animation: carta-entrada 1.5s ease;
            border: 3px solid #ffb6c1;
        }

        @keyframes carta-entrada {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(50px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Decoración de esquinas */
        .corner-decoration {
            position: absolute;
            font-size: 40px;
            opacity: 0.3;
        }
        .corner-top-left { top: 10px; left: 10px; }
        .corner-top-right { top: 10px; right: 10px; }
        .corner-bottom-left { bottom: 10px; left: 10px; }
        .corner-bottom-right { bottom: 10px; right: 10px; }

        /* Título */
        .titulo {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5em;
            text-align: center;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: latido 1.5s ease infinite;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitulo {
            font-family: 'Dancing Script', cursive;
            text-align: center;
            color: #ff6b9d;
            font-size: 1.8em;
            margin-bottom: 30px;
            animation: fadeIn 2s ease;
        }

        /* Para y De */
        .para-de {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 2.5s ease;
        }

        .para {
            font-family: 'Pacifico', cursive;
            font-size: 1.6em;
            color: #ff6b9d;
            margin-bottom: 10px;
            animation: glow 2s ease infinite;
        }

        .de {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4em;
            color: #ff8fa3;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 107, 157, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 107, 157, 0.8), 0 0 30px rgba(255, 107, 157, 0.6); }
        }

        /* Mensaje */
        .mensaje-container {
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
            padding: 30px 25px;
            border-radius: 20px;
            border: 2px dashed #ffb6c1;
            margin: 25px 0;
            position: relative;
            animation: fadeIn 3s ease;
        }

        .mensaje {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
            line-height: 2;
            color: #5a4a4a;
            text-align: center;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Corazón animado grande */
        .corazon-grande {
            text-align: center;
            font-size: 4em;
            margin: 25px 0;
            animation: corazon-pulse 1.5s ease infinite;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .corazon-grande:hover {
            transform: scale(1.2);
        }

        @keyframes corazon-pulse {
            0%, 100% { 
                transform: scale(1);
                filter: drop-shadow(0 0 10px rgba(255, 107, 157, 0.5));
            }
            25% { 
                transform: scale(1.1);
            }
            50% { 
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 107, 157, 0.8));
            }
            75% { 
                transform: scale(1.15);
            }
        }

        /* Fecha */
        .fecha {
            text-align: right;
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
            color: #ff8fa3;
            margin-top: 25px;
            font-style: italic;
            animation: fadeIn 3.5s ease;
        }

        /* Firma decorativa */
        .firma {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #ffb6c1;
            animation: fadeIn 4s ease;
        }

        .firma-texto {
            font-family: 'Great Vibes', cursive;
            font-size: 2em;
            color: #ff6b9d;
        }

        /* Loading y Error */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #fff;
            font-size: 1.5em;
            font-family: 'Dancing Script', cursive;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .error {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error h2 {
            font-family: 'Great Vibes', cursive;
            color: #ff6b9d;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .error p {
            color: #666;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .btn-home {
            display: inline-block;
            padding: 15px 35px;
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1em;
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: fadeIn 4s ease;
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.6);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #fff;
            font-size: 0.9em;
            position: relative;
            z-index: 1;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            animation: fadeIn 4.5s ease;
        }

        .footer-heart {
            color: #ff6b9d;
            animation: latido 1.5s ease infinite;
            display: inline-block;
        }

        /* Animaciones fade in */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .titulo {
                font-size: 2.5em;
            }
            .subtitulo {
                font-size: 1.4em;
            }
            .para {
                font-size: 1.3em;
            }
            .de {
                font-size: 1.2em;
            }
            .mensaje {
                font-size: 1.3em;
            }
            .carta {
                padding: 30px 20px;
                margin: 10px;
            }
            .corazon-grande {
                font-size: 3em;
            }
        }

        @media (max-width: 480px) {
            .titulo {
                font-size: 2em;
            }
            .mensaje {
                font-size: 1.2em;
            }
            .carta {
                padding: 25px 15px;
            }
        }

        /* Efecto de brillo */
        .brillo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: brillo-expand 3s ease-out infinite;
        }

        @keyframes brillo-expand {
            0% {
                width: 0;
                height: 0;
                opacity: 0.8;
            }
            100% {
                width: 500px;
                height: 500px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Corazones flotantes de fondo -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Contenedor principal -->
    <div class="container">
        <div id="content">
            <div class="loading">💌 Cargando tu carta especial...</div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Hecho con <span class="footer-heart">💖</span> para alguien especial
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, increment, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMeWl3gz-iALWcMPwHW6TMgEEIUSYKBTw",
            authDomain: "personalizacion-38cb1.firebaseapp.com",
            projectId: "personalizacion-38cb1",
            storageBucket: "personalizacion-38cb1.firebasestorage.app",
            messagingSenderId: "434378253117",
            appId: "1:434378253117:web:2c7a01062787756201db54",
            measurementId: "G-HTVYPVSG4X"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Crear corazones flotantes
        function crearCorazones() {
            const container = document.getElementById('heartsContainer');
            const corazones = ['💖', '💕', '💗', '💓', '💝', '❤️', '💘'];
            
            setInterval(() => {
                const corazon = document.createElement('div');
                corazon.className = 'floating-heart';
                corazon.textContent = corazones[Math.floor(Math.random() * corazones.length)];
                corazon.style.left = Math.random() * 100 + '%';
                corazon.style.animationDuration = (Math.random() * 5 + 8) + 's';
                corazon.style.fontSize = (Math.random() * 15 + 15) + 'px';
                container.appendChild(corazon);
                
                setTimeout(() => corazon.remove(), 13000);
            }, 800);
        }

        // Crear pétalos cayendo
        function crearPetalos() {
            const container = document.getElementById('heartsContainer');
            const petalos = ['🌸', '🌹', '💐'];
            
            setInterval(() => {
                const petalo = document.createElement('div');
                petalo.className = 'petal';
                petalo.textContent = petalos[Math.floor(Math.random() * petalos.length)];
                petalo.style.left = Math.random() * 100 + '%';
                petalo.style.animationDuration = (Math.random() * 5 + 12) + 's';
                container.appendChild(petalo);
                
                setTimeout(() => petalo.remove(), 17000);
            }, 1500);
        }

        // Iniciar animaciones
        crearCorazones();
        crearPetalos();

        // Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const cartaId = urlParams.get('id');

        async function cargarCarta() {
            const content = document.getElementById('content');

            if (!cartaId) {
                content.innerHTML = `
                    <div class="error">
                        <h2>💔 Ups...</h2>
                        <p>No se encontró ninguna carta especial.</p>
                        <p>El link puede estar incompleto o incorrecto.</p>
                        <a href="crear.html" class="btn-home">✨ Crear una carta</a>
                    </div>
                `;
                return;
            }

            try {
                const docRef = doc(db, "cartas", cartaId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Incrementar visitas
                    try {
                        await updateDoc(docRef, { visitas: increment(1) });
                    } catch (err) {
                        console.log('No se pudo actualizar visitas');
                    }

                    // Formatear fecha
                    let fechaFormateada = 'Hoy';
                    if (data.fechaCreacion) {
                        const fecha = data.fechaCreacion.toDate();
                        const opciones = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                        fechaFormateada = fecha.toLocaleDateString('es-ES', opciones);
                    }

                    // Mostrar carta romántica
                    content.innerHTML = `
                        <div class="carta">
                            <div class="corner-decoration corner-top-left">💕</div>
                            <div class="corner-decoration corner-top-right">💖</div>
                            <div class="corner-decoration corner-bottom-left">💗</div>
                            <div class="corner-decoration corner-bottom-right">💕</div>
                            
                            <h1 class="titulo">Carta de Amor</h1>
                            <p class="subtitulo">Algo especial para ti</p>
                            
                            <div class="para-de">
                                <div class="para">💌 Para: ${data.nombreNovia}</div>
                                <div class="de">💙 De: ${data.nombreRemitente}</div>
                            </div>
                            
                            <div class="corazon-grande" onclick="this.style.transform='scale(1.3)'; setTimeout(()=>this.style.transform='scale(1)', 300)">
                                💝
                            </div>
                            
                            <div class="mensaje-container">
                                <div class="mensaje">${data.mensaje}</div>
                            </div>
                            
                            <div class="fecha">📅 ${fechaFormateada}</div>
                            
                            <div class="firma">
                                <div class="firma-texto">Con todo mi amor</div>
                            </div>
                            
                            <div class="brillo"></div>
                        </div>
                    `;

                    document.title = `💌 Carta especial para ${data.nombreNovia}`;

                } else {
                    content.innerHTML = `
                        <div class="error">
                            <h2>💔 Carta no encontrada</h2>
                            <p>Parece que esta carta ya no está disponible.</p>
                            <a href="crear.html" class="btn-home">✨ Crear una nueva carta</a>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                content.innerHTML = `
                    <div class="error">
                        <h2>❌ Oh no...</h2>
                        <p>No pudimos cargar la carta.</p>
                        <p style="font-size: 0.9em; color: #999;">${error.message}</p>
                        <a href="crear.html" class="btn-home">✨ Intentar de nuevo</a>
                    </div>
                `;
            }
        }

        cargarCarta();
    </script>
</body>
</html>
