<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Carta de Amor 💌</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #667eea;
            outline: none;
        }
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-generate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        #result {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            color: white;
            text-align: center;
            animation: slideIn 0.5s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #result h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .link-box {
            background: white;
            color: #333;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            margin: 15px 0;
            font-size: 14px;
            font-family: monospace;
        }
        .btn-copy {
            background: white;
            color: #f5576c;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-copy:hover {
            background: #f8f9fa;
            transform: scale(1.05);
        }
        .heart {
            font-size: 3em;
            margin: 10px 0;
            animation: heartbeat 1.5s ease infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .login-notice {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .login-notice a {
            color: #856404;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💌 Crear Carta de Amor</h1>
        <p class="subtitle">Personaliza una carta especial y genera un link único</p>
        
        <div id="loginNotice" class="login-notice" style="display: none;">
            🔐 Para crear cartas, <a href="index.html">inicia sesión</a> primero
        </div>

        <form id="cartaForm">
            <div class="form-group">
                <label for="nombreNovia">💖 Nombre de tu novia:</label>
                <input type="text" id="nombreNovia" placeholder="Ej: María" required>
            </div>

            <div class="form-group">
                <label for="nombreRemitente">💙 Tu nombre:</label>
                <input type="text" id="nombreRemitente" placeholder="Ej: Juan" required>
            </div>

            <div class="form-group">
                <label for="mensaje">✍️ Tu mensaje especial:</label>
                <textarea id="mensaje" placeholder="Escribe aquí todo lo que sientes..." required></textarea>
            </div>

            <button type="submit" class="btn-generate" id="btnGenerate">
                💝 Generar Link Mágico
            </button>
        </form>

        <div id="result">
            <div class="heart">💌</div>
            <h3>¡Tu carta está lista!</h3>
            <p>Comparte este link con esa persona especial:</p>
            <div class="link-box" id="linkBox"></div>
            <button class="btn-copy" onclick="copiarLink()">📋 Copiar Link</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMeWl3gz-iALWcMPwHW6TMgEEIUSYKBTw",
            authDomain: "personalizacion-38cb1.firebaseapp.com",
            projectId: "personalizacion-38cb1",
            storageBucket: "personalizacion-38cb1.firebasestorage.app",
            messagingSenderId: "434378253117",
            appId: "1:434378253117:web:2c7a01062787756201db54",
            measurementId: "G-HTVYPVSG4X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Verificar autenticación
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById('loginNotice').style.display = 'block';
                document.getElementById('btnGenerate').disabled = true;
            }
        });

        // Generar carta
        document.getElementById('cartaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = auth.currentUser;
            if (!user) {
                alert('Debes iniciar sesión para crear una carta');
                return;
            }

            const btnGenerate = document.getElementById('btnGenerate');
            const result = document.getElementById('result');
            const linkBox = document.getElementById('linkBox');

            btnGenerate.disabled = true;
            btnGenerate.textContent = '⏳ Generando...';

            try {
                const nombreNovia = document.getElementById('nombreNovia').value.trim();
                const nombreRemitente = document.getElementById('nombreRemitente').value.trim();
                const mensaje = document.getElementById('mensaje').value.trim();

                // Guardar en Firestore
                const docRef = await addDoc(collection(db, "cartas"), {
                    nombreNovia: nombreNovia,
                    nombreRemitente: nombreRemitente,
                    mensaje: mensaje,
                    autor: user.uid,
                    autorEmail: user.email,
                    fechaCreacion: serverTimestamp(),
                    visitas: 0
                });

                // Generar URL
                const baseUrl = window.location.href.split('/').slice(0, -1).join('/') + '/ver.html';
                const cartaUrl = `${baseUrl}?id=${docRef.id}`;

                // Mostrar resultado
                linkBox.textContent = cartaUrl;
                result.style.display = 'block';
                result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            } catch (error) {
                console.error('Error:', error);
                alert('Error al crear la carta: ' + error.message);
            } finally {
                btnGenerate.disabled = false;
                btnGenerate.textContent = '💝 Generar Link Mágico';
            }
        });

        // Función global para copiar
        window.copiarLink = function() {
            const linkBox = document.getElementById('linkBox');
            navigator.clipboard.writeText(linkBox.textContent).then(() => {
                alert('✅ Link copiado al portapapeles');
            }).catch(err => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = linkBox.textContent;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('✅ Link copiado al portapapeles');
            });
        };
    </script>
</body>
</html>
